services:
  legal-paragraph-api:
    build: .
    container_name: my_little_rag_law_retrieval
    volumes:
      - ./input:/app/input
      - ./data:/app/data
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      # DNS-rebinding protection: disable so requests from other containers/
      # hosts are accepted. For public exposure, set MCP_ALLOWED_HOSTS instead.
      - LEGAL_SOURCES_FILE=input/sources.txt
      - LEGAL_DB_PATH=data/legal.db
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - owui-tools

networks:
  owui-tools:
    external: true
