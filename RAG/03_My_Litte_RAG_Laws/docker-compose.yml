services:
  legal-paragraph-api:
    build: .
    container_name: my_little_rag_law_retrieval
    volumes:
      - ./input:/app/input
      - ./data:/app/data
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      # Data loading mode:
      #   serve — start with existing DB (default)
      #   fetch — nuke DB + cache, download fresh, populate, then serve
      #   local — nuke DB, parse from data/cache/, populate, then serve
      - FETCH_MODE=serve
      - LEGAL_SOURCES_FILE=input/sources.txt
      - LEGAL_DB_PATH=data/legal.db
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - owui-tools

networks:
  owui-tools:
    external: true
