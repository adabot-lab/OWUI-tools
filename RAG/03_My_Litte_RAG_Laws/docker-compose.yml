services:
  legal-paragraph-api:
    build: .
    container_name: my_little_rag_law_retrieval
    ports:
      - "8000:8000"
    volumes:
      - ./input:/app/input
      - ./data:/app/data
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      # Data loading mode:
      #   serve — start with existing DB (default)
      #   fetch — refresh: nuke all + re-download if DB exists;
      #          else use cache if available, else download fresh
      #   local — nuke DB, parse from data/cache/, populate, then serve
      - FETCH_MODE=${FETCH_MODE}
      - LEGAL_SOURCES_FILE=${LEGAL_SOURCES_FILE}
      - LEGAL_DB_PATH=${LEGAL_DB_PATH}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - ollama-tools

